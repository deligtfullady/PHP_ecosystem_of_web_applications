; Установка:
;   sudo cp deploy/supervisor/reminder.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
; Путь к проекту и пользователя замените на свои.

[program:reminder-worker]
command=php8.2 /var/www/telegram-reminder-bot/runner -c worker
directory=/var/www/telegram-reminder-bot
user=www-data
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/reminder-worker.log
redirect_stderr=true

[program:reminder-tg]
command=php8.2 /var/www/telegram-reminder-bot/runner -c tg_messages
directory=/var/www/telegram-reminder-bot
user=www-data
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/reminder-tg.log
redirect_stderr=true

[program:reminder-queue]
command=php8.2 /var/www/telegram-reminder-bot/runner -c queue_manager
directory=/var/www/telegram-reminder-bot
user=www-data
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/reminder-queue.log
redirect_stderr=true
